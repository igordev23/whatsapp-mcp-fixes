[project]
name = "whatsapp-mcp-server"
version = "0.1.0"
description = "MCP server for WhatsApp: read, search and send messages, download media and transcribe voice notes locally"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.0,<2",
    "requests>=2.32.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
